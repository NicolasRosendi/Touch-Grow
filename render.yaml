# Render Blueprint — sitio estático de la landing de Tech&Grow.
# En Render: New → Blueprint → elegí este repositorio. O bien New → Static Site con
# Build Command vacío y Publish Directory "." (raíz del repo).
services:
  - type: web
    name: techandgrow-landing
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
